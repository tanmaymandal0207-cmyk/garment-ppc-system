<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Garment PPC System: order scheduling and machine capacity planning in Excel 365">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6FB"/>
      <stop offset="1" stop-color="#F1E6EE"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2D2E2"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="298" rx="18"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1278" height="298" rx="18" fill="url(#bg)" stroke="#E5D6E4" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="840" y="0" width="440" height="300" fill="url(#grid)" opacity="0.7"/>
    <rect x="0" y="0" width="10" height="300" fill="#B998C4"/>
  </g>

  <!-- line plan: sewing lines × days, one style block per run -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8C7499">
    <text x="868" y="70">L1</text><text x="868" y="104">L2</text><text x="868" y="138">L3</text><text x="868" y="172">L4</text><text x="868" y="206">L5</text>
  </g>
  <g>
    <line x1="896" y1="46" x2="896" y2="216" stroke="#E2D2E2" stroke-width="2"/>
    <rect x="904" y="56" width="120" height="20" rx="10" fill="#D9C4E6"/>
    <rect x="1030" y="56" width="80" height="20" rx="10" fill="#F3C9D3"/>
    <rect x="904" y="90" width="64" height="20" rx="10" fill="#F3C9D3"/>
    <rect x="974" y="90" width="136" height="20" rx="10" fill="#CFE0EE"/>
    <rect x="904" y="124" width="150" height="20" rx="10" fill="#F6DDB8"/>
    <rect x="1060" y="124" width="50" height="20" rx="10" fill="#D9C4E6"/>
    <rect x="904" y="158" width="92" height="20" rx="10" fill="#CFE0EE"/>
    <rect x="1002" y="158" width="108" height="20" rx="10" fill="#F3C9D3"/>
    <rect x="904" y="192" width="206" height="20" rx="10" fill="#D9C4E6"/>
    <!-- today marker -->
    <line x1="1046" y1="42" x2="1046" y2="222" stroke="#9A6FAE" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="1046" cy="42" r="5" fill="#9A6FAE"/>
  </g>

  <!-- capacity gauge: required vs installed machines -->
  <g>
    <rect x="1132" y="56" width="28" height="156" rx="14" fill="#EADCEB"/>
    <rect x="1132" y="75" width="28" height="137" rx="14" fill="#C9A6D6"/>
    <line x1="1124" y1="75" x2="1168" y2="75" stroke="#B48BC4" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="1124" y1="56" x2="1168" y2="56" stroke="#7C5A8E" stroke-width="2"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#5E4570">
      <text x="1174" y="60" font-size="12" font-weight="700">920</text>
      <text x="1174" y="72" font-size="10">installed</text>
      <text x="1174" y="94" font-size="12" font-weight="700">808</text>
      <text x="1174" y="106" font-size="10">peak need</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="90" fill="#9A6FAE" font-size="19" font-weight="600" letter-spacing="3">EXCEL 365  ·  PRODUCTION PLANNING &amp; CONTROL</text>
    <text x="64" y="148" fill="#3D2C4E" font-size="48" font-weight="700">Garment PPC System</text>
    <text x="64" y="190" fill="#5E4A6E" font-size="21">From purchase order to sewing line: schedules, OTIF and machine capacity</text>
    <rect x="64" y="218" width="700" height="40" rx="20" fill="#EFE2F0"/>
    <text x="84" y="244" fill="#6E4F82" font-size="17">191 orders  ·  26 sewing lines  ·  42 style recipes  ·  920 machines  ·  105-day plan</text>
  </g>
</svg>
